<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSEP SPOT</title>
    <link rel="stylesheet" href="css\style.css">
    <link rel="stylesheet" href="css\index.css">

</head>

<body>
    <!-- Password screen -->
    <div id="password-screen">
        <form id="password-form">
            <h2>Enter Password</h2>
            <p>Please enter the password to access this website.</p>

            <input
                type="password"
                id="site-password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Enter</button>

            <p id="password-error"></p>
        </form>
    </div>

    <div id="header">
        <h1 id="big-title">
            <a id="index-link" href="index.html" class="page-selector">
                GSEP Spot
            </a>
        </h1>

        <a id="order-link" href="order.html" class="page-selector">
            Order
        </a>

        <a id="kitchen-link" href="kitchen.html" class="page-selector">
            Kitchen
        </a>

        <a id="history-link" href="history.html" class="page-selector">
            History
        </a>
        <hr id="header-divider">
    </div>    

    <script src="js\index.js" defer></script>
    <script src="js\password.js" defer></script>
    <script src="js\firebase-config.js" type="module"></script>
</body>
</html>
